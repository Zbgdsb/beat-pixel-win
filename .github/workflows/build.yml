name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup SFML
        shell: pwsh
        run: |
          # 下载SFML for MSVC
          Invoke-WebRequest -Uri "https://github.com/SFML/SFML/releases/download/2.6.1/SFML-2.6.1-windows-vc17-64-bit.zip" -OutFile sfml.zip
          Expand-Archive -Path sfml.zip -DestinationPath .
          Rename-Item "SFML-2.6.1" "sfml"
          dir sfml/lib/

      - name: Build
        shell: cmd
        run: |
          mkdir build-win
          set SFML_DIR=sfml
          cl /std:c++17 /O2 /W3 /EHsc /DBEATPIXEL_USE_SFML /I"%SFML_DIR%\include" /c /Fobuild-win\main.obj src\main.cpp
          cl /std:c++17 /O2 /W3 /EHsc /DBEATPIXEL_USE_SFML /I"%SFML_DIR%\include" /c /Fobuild-win\GameWindow.obj src\GameWindow.cpp
          cl /std:c++17 /O2 /W3 /EHsc /DBEATPIXEL_USE_SFML /I"%SFML_DIR%\include" /c /Fobuild-win\NoteTrack.obj src\NoteTrack.cpp
          cl /std:c++17 /O2 /W3 /EHsc /DBEATPIXEL_USE_SFML /I"%SFML_DIR%\include" /c /Fobuild-win\Note.obj src\Note.cpp
          cl /std:c++17 /O2 /W3 /EHsc /DBEATPIXEL_USE_SFML /I"%SFML_DIR%\include" /c /Fobuild-win\ScoreSystem.obj src\ScoreSystem.cpp
          cl /std:c++17 /O2 /W3 /EHsc /DBEATPIXEL_USE_SFML /I"%SFML_DIR%\include" /c /Fobuild-win\AudioManager.obj src\AudioManager.cpp
          cl /std:c++17 /O2 /W3 /EHsc /DBEATPIXEL_USE_SFML /I"%SFML_DIR%\include" /c /Fobuild-win\BeatParser.obj src\BeatParser.cpp
          cl /std:c++17 /O2 /W3 /EHsc /DBEATPIXEL_USE_SFML /I"%SFML_DIR%\include" /c /Fobuild-win\DataManager.obj src\DataManager.cpp
          link /OUT:BeatPixel.exe build-win\*.obj /LIBPATH:%SFML_DIR%\lib sfml-graphics.lib sfml-window.lib sfml-system.lib sfml-audio.lib opengl32.lib gdi32.lib user32.lib advapi32.lib winmm.lib

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp BeatPixel.exe dist/
          cp sfml/bin/sfml-*.dll dist/ 2>/dev/null || true
          cp sfml/bin/openal*.dll dist/ 2>/dev/null || true
          cp -r assets dist/ 2>/dev/null || true
          cp -r songs dist/ 2>/dev/null || true
          echo "双击 BeatPixel.exe 运行游戏" > dist/运行说明.txt
          echo "=== 文件列表 ==="
          ls -la dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BeatPixel-Windows
          path: dist/
          retention-days: 90
