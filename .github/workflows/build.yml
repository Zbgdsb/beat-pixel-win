name: Build BeatPixel (Windows)

on:
  push:
    branches: [main, master]
  workflow_dispatch:  # 允许手动触发

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2 (MinGW64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-make
            mingw-w64-x86_64-openal
            mingw-w64-x86_64-freetype
            base-devel
            git

      - name: Download SFML 3
        shell: pwsh
        run: |
          # Try official SFML 3.0.0 MinGW build
          $url = "https://www.sfml-dev.org/files/SFML-3.0.0-windows-gcc-14.2.0-mingw-64-bit.zip"
          Invoke-WebRequest -Uri $url -OutFile "sfml3.zip"
          Expand-Archive sfml3.zip -DestinationPath .
          $dir = Get-ChildItem -Directory -Name "SFML-*"
          Rename-Item $dir sfml3
          echo "SFML installed:"
          ls sfml3/include/SFML/

      - name: Compile BeatPixel
        shell: msys2 {0}
        run: |
          set -e
          export PATH="/mingw64/bin:$PATH"
          
          g++ --version
          
          g++ -std=c++17 -O2 -Wall \
            -Isrc -Isfml3/include -DBEATPIXEL_USE_SFML \
            -o BeatPixel.exe \
            src/main.cpp \
            src/GameWindow.cpp \
            src/NoteTrack.cpp \
            src/Note.cpp \
            src/ScoreSystem.cpp \
            src/AudioManager.cpp \
            src/BeatParser.cpp \
            src/DataManager.cpp \
            src/SongAnalyzer.cpp \
            src/ChartPackage.cpp \
            src/AchievementSystem.cpp \
            -Lsfml3/lib \
            -lsfml-graphics -lsfml-window -lsfml-system -lsfml-audio \
            -lwinmm -lopengl32 -lgdi32 -lfreetype
          
          echo "=== BUILD OK ==="
          ls -la BeatPixel.exe

      - name: Collect release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release/BeatPixel -Force
          
          # Copy exe
          Copy-Item BeatPixel.exe release/BeatPixel/
          
          # Copy SFML DLLs
          Copy-Item sfml3/bin/sfml-*.dll release/BeatPixel/
          Copy-Item sfml3/bin/OpenAL32.dll release/BeatPixel/ -ErrorAction SilentlyContinue
          
          # Copy assets
          Copy-Item -Recurse assets/sounds release/BeatPixel/assets/sounds -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path release/BeatPixel/songs -Force
          
          # Copy readme
          Copy-Item README_WINDOWS.txt release/BeatPixel/ -ErrorAction SilentlyContinue
          
          Write-Host "Release folder:"
          Get-ChildItem release/BeatPixel/ -Recurse

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BeatPixel-Windows
          path: release/BeatPixel/
          retention-days: 30
