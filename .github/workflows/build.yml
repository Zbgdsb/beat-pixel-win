name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MinGW
        shell: pwsh
        run: |
          choco install mingw -y --no-progress
          $mingwPath = "C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64\mingw64\bin"
          echo "$mingwPath" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          g++ --version

      - name: Download SFML
        shell: bash
        run: |
          curl -fsSL -o sfml.zip "https://github.com/SFML/SFML/releases/download/2.6.1/SFML-2.6.1-windows-gcc-13.1.0-mingw-64-bit.zip"
          unzip -q sfml.zip
          mv SFML-2.6.1 sfml-mingw
          ls sfml-mingw/include/ 2>/dev/null

      - name: Build
        shell: bash
        run: |
          mkdir -p build-win
          SFML_INC="-Isfml-mingw/include"
          SFML_LIB="-Lsfml-mingw/lib -lsfml-graphics -lsfml-window -lsfml-system -lsfml-audio -lwinmm -lopengl32 -lgdi32 -luser32"
          for f in src/*.cpp; do
            obj="build-win/$(basename "$f" .cpp).o"
            echo "Compiling $f ..."
            g++ -std=c++17 -O2 -Wall -DBEATPIXEL_USE_SFML $SFML_INC -c -o "$obj" "$f" || exit 1
          done
          echo "Linking..."
          g++ -std=c++17 -O2 -o BeatPixel.exe build-win/*.o $SFML_LIB || exit 1
          echo "Build success!"

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp BeatPixel.exe dist/
          # 复制SFML DLL
          cp sfml-mingw/bin/*.dll dist/ 2>/dev/null || true
          cp -r assets dist/ 2>/dev/null || true
          cp -r songs dist/ 2>/dev/null || true
          echo "双击 BeatPixel.exe 运行游戏" > dist/运行说明.txt
          echo "需要保持所有文件在同一目录" >> dist/运行说明.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BeatPixel-Windows
          path: dist/
          retention-days: 90
