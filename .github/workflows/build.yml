name: Build-BeatPixel-Windows

on:
  push:
    branches: [main, master]
    paths-ignore: ['*.md']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-openal mingw-w64-x86_64-freetype mingw-w64-x86_64-flac mingw-w64-x86_64-libvorbis mingw-w64-x86_64-libogg base-devel

      - name: Test g++ works
        run: g++ --version

      - name: Test SFML download
        run: |
          echo "Testing network..."
          curl -sI "https://www.sfml-dev.org" | head -1

      - name: Get SFML 3
        run: |
          curl -L -o sfml3.zip "https://www.sfml-dev.org/files/SFML-3.0.0-windows-gcc-14.2.0-mingw-64-bit.zip"
          unzip -q sfml3.zip
          mv SFML-* sfml3
          ls sfml3/lib/libsfml-graphics.a

      - name: Compile
        run: |
          g++ -std=c++17 -O2 -Wall \
            -Isrc -Isfml3/include -DBEATPIXEL_USE_SFML \
            -o BeatPixel.exe \
            src/main.cpp \
            src/GameWindow.cpp \
            src/NoteTrack.cpp \
            src/Note.cpp \
            src/ScoreSystem.cpp \
            src/AudioManager.cpp \
            src/BeatParser.cpp \
            src/DataManager.cpp \
            src/SongAnalyzer.cpp \
            src/ChartPackage.cpp \
            src/AchievementSystem.cpp \
            -Lsfml3/lib \
            -lsfml-graphics -lsfml-window -lsfml-system -lsfml-audio \
            -lwinmm -lopengl32 -lgdi32 -lfreetype \
            -static-libgcc -static-libstdc++
          echo "BUILD OK"
          ls -la BeatPixel.exe

      - name: Package to ZIP
        run: |
          mkdir -p pkg/BeatPixel/assets/sounds
          mkdir -p pkg/BeatPixel/songs
          cp BeatPixel.exe pkg/BeatPixel/
          cp sfml3/bin/sfml-*.dll pkg/BeatPixel/ 2>/dev/null || true
          cp /mingw64/bin/OpenAL32.dll pkg/BeatPixel/ 2>/dev/null || true
          cp /mingw64/bin/libFLAC*.dll pkg/BeatPixel/ 2>/dev/null || true
          cp /mingw64/bin/libvorbis*.dll pkg/BeatPixel/ 2>/dev/null || true
          cp /mingw64/bin/libogg*.dll pkg/BeatPixel/ 2>/dev/null || true
          cp -r assets/sounds/* pkg/BeatPixel/assets/sounds/ 2>/dev/null || true
          printf '双击 BeatPixel.exe 运行\n按键: D F J K L ; 六键\n' > pkg/BeatPixel/使用说明.txt
          ls -la pkg/BeatPixel/

      - uses: actions/upload-artifact@v4
        with:
          name: BeatPixel
          path: pkg/BeatPixel/
          retention-days: 90
