name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MinGW
        shell: pwsh
        run: |
          choco install mingw -y --no-progress
          $mingwPath = "C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64\mingw64\bin"
          echo "$mingwPath" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          g++ --version

      - name: Setup EasyX
        shell: bash
        run: |
          curl -fsSL -o easyx.exe "https://docs.easyx.cn/releases/easyx_20240901.exe" || \
          curl -fsSL -o easyx.exe "https://easyx.cn/releases/easyx_20240901.exe"
          # 解压EasyX
          7z x easyx.exe -oeasyx_raw -y || true
          ls easyx_raw/ 2>/dev/null
          # 复制头文件和库到MinGW
          MINGW_DIR="/c/ProgramData/chocolatey/lib/mingw/tools/install/mingw64/mingw64"
          cp easyx_raw/include/* "$MINGW_DIR/include/" 2>/dev/null || true
          cp easyx_raw/lib64/* "$MINGW_DIR/lib/" 2>/dev/null || true
          cp easyx_raw/lib64/* "$MINGW_DIR/x86_64-w64-mingw32/lib/" 2>/dev/null || true
          echo "EasyX setup done"

      - name: Build
        shell: bash
        run: |
          mkdir -p build
          for f in src/*.cpp; do
            obj="build/$(basename "$f" .cpp).o"
            echo "Compiling $f ..."
            g++ -std=c++17 -O2 -Wall -c -o "$obj" "$f" || exit 1
          done
          echo "Linking..."
          g++ -std=c++17 -O2 -o BeatPixel.exe build/*.o -leasyx -lmsimg32 -lwinmm -lgdi32 -luser32 || exit 1
          echo "Build success!"

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp BeatPixel.exe dist/
          cp -r assets dist/ 2>/dev/null || true
          cp -r songs dist/ 2>/dev/null || true
          echo "双击 BeatPixel.exe 运行游戏" > dist/运行说明.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BeatPixel-Windows
          path: dist/
          retention-days: 90
