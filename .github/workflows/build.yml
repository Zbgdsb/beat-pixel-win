name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MinGW
        uses: egor-tensin/setup-mingw@v2
        with:
          platform: x64

      - name: Setup EasyX
        shell: bash
        run: |
          # 下载EasyX (尝试多个来源)
          curl -fsSL -o easyx_setup.exe "https://docs.easyx.cn/releases/easyx_20240901.exe" || \
          curl -fsSL -o easyx_setup.exe "https://easyx.cn/releases/easyx_20240901.exe"
          # 用7z解压
          "/c/Program Files/7-Zip/7z.exe" x easyx_setup.exe -oeasyx_raw -y || true
          # 复制文件到MinGW
          if [ -d "easyx_raw/include" ]; then
            cp easyx_raw/include/* /c/msys64/mingw64/include/ 2>/dev/null || \
            cp easyx_raw/include/* "$MINGW_PREFIX/include/" 2>/dev/null || true
          fi
          if [ -d "easyx_raw/lib64" ]; then
            cp easyx_raw/lib64/* /c/msys64/mingw64/lib/ 2>/dev/null || \
            cp easyx_raw/lib64/* "$MINGW_PREFIX/lib/" 2>/dev/null || true
          fi

      - name: Build
        shell: bash
        run: |
          mkdir -p build
          for f in src/*.cpp; do
            obj="build/$(basename "$f" .cpp).o"
            echo "Compiling $f ..."
            g++ -std=c++17 -O2 -Wall -c -o "$obj" "$f" || exit 1
          done
          echo "Linking..."
          g++ -std=c++17 -O2 -o BeatPixel.exe build/*.o -leasyx -lmsimg32 -lwinmm -lgdi32 -luser32 || exit 1
          echo "Build success!"

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp BeatPixel.exe dist/
          cp -r assets dist/ 2>/dev/null || true
          cp -r songs dist/ 2>/dev/null || true
          echo "双击 BeatPixel.exe 运行游戏" > dist/运行说明.txt
          echo "需要在 BeatPixel 文件夹下运行" >> dist/运行说明.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BeatPixel-Windows
          path: dist/
          retention-days: 90
