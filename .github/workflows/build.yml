name: Build BeatPixel (Windows 一键运行版)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2 (MinGW64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-openal
            mingw-w64-x86_64-freetype
            mingw-w64-x86_64-flac
            mingw-w64-x86_64-libvorbis
            mingw-w64-x86_64-libogg
            base-devel

      - name: Download SFML 3
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://www.sfml-dev.org/files/SFML-3.0.0-windows-gcc-14.2.0-mingw-64-bit.zip" -OutFile "sfml3.zip"
          Expand-Archive sfml3.zip -DestinationPath .
          $dir = Get-ChildItem -Directory -Name "SFML-*"
          Rename-Item $dir sfml3
          echo "SFML DLLs:"
          ls sfml3/bin/

      - name: Compile BeatPixel (static runtime, bundled DLLs)
        shell: msys2 {0}
        run: |
          set -e
          export PATH="/mingw64/bin:$PATH"

          # Find OpenAL and other DLLs from MSYS2
          cp /mingw64/bin/OpenAL32.dll ./ 2>/dev/null || true
          cp /mingw64/bin/libFLAC*.dll ./ 2>/dev/null || true
          cp /mingw64/bin/libvorbis*.dll ./ 2>/dev/null || true
          cp /mingw64/bin/libogg*.dll ./ 2>/dev/null || true

          g++ -std=c++17 -O2 -Wall \
            -Isrc -Isfml3/include -DBEATPIXEL_USE_SFML \
            -o BeatPixel.exe \
            src/main.cpp \
            src/GameWindow.cpp \
            src/NoteTrack.cpp \
            src/Note.cpp \
            src/ScoreSystem.cpp \
            src/AudioManager.cpp \
            src/BeatParser.cpp \
            src/DataManager.cpp \
            src/SongAnalyzer.cpp \
            src/ChartPackage.cpp \
            src/AchievementSystem.cpp \
            -Lsfml3/lib \
            -lsfml-graphics -lsfml-window -lsfml-system -lsfml-audio \
            -lwinmm -lopengl32 -lgdi32 -lfreetype \
            -static-libgcc -static-libstdc++

          echo "=== BUILD OK ==="
          ls -la BeatPixel.exe

      - name: Package (exe + DLLs + assets 全打包)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path pkg/BeatPixel -Force

          # 核心 exe
          Copy-Item BeatPixel.exe pkg/BeatPixel/

          # SFML DLLs
          Copy-Item sfml3/bin/sfml-*.dll pkg/BeatPixel/

          # OpenAL + FLAC + Vorbis + Ogg (音频依赖)
          Copy-Item OpenAL32.dll pkg/BeatPixel/ -ErrorAction SilentlyContinue
          Copy-Item libFLAC*.dll pkg/BeatPixel/ -ErrorAction SilentlyContinue
          Copy-Item libvorbis*.dll pkg/BeatPixel/ -ErrorAction SilentlyContinue
          Copy-Item libogg*.dll pkg/BeatPixel/ -ErrorAction SilentlyContinue

          # 音效
          New-Item -ItemType Directory -Path pkg/BeatPixel/assets/sounds -Force
          Copy-Item -Recurse assets/sounds/* pkg/BeatPixel/assets/sounds/ -ErrorAction SilentlyContinue

          # 歌曲目录（空，老师自己放 mp3）
          New-Item -ItemType Directory -Path pkg/BeatPixel/songs -Force

          # 使用说明 for 老师
@"
BeatPixel - 节拍像素  v3.1
==========================
使用方法：双击 BeatPixel.exe 即可运行

按键说明：
  D F J K L ;  →  六键游戏
  ESC          →  返回
  ↑ ↓ Enter    →  菜单导航

将 MP3 歌曲放入 songs 文件夹即可游玩
"@ | Out-File -FilePath pkg/BeatPixel/使用说明.txt -Encoding UTF8

          Write-Host "=== 打包内容 ==="
          Get-ChildItem pkg/BeatPixel/ -Recurse | ForEach-Object { $_.FullName.Replace($pwd.Path + '\pkg\BeatPixel\', '') }

      - name: Upload ZIP (给老师直接用的)
        uses: actions/upload-artifact@v4
        with:
          name: BeatPixel-直接双击运行
          path: pkg/BeatPixel/
          retention-days: 90
